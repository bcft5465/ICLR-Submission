# ---------- Metrics ----------
metrics:
  ece_bins: 10                     # NOW actually read by compute_metrics.py
  faithfulness_threshold: 0.5

  halluscore:
    # NOW actually read by compute_metrics.py (previously dead/ignored).
    # Field names reflect the redesigned formula:
    #   HalluScore = w_discrimination * Discrimination
    #              + w_ece           * (1 - ECE)
    #              + w_type_accuracy * TypeAccuracy
    # where Discrimination = sqrt(MCC_norm * F1) (NOT raw clean-sample
    # accuracy — that was the pre-review formula that let a degenerate
    # "always predict faithful" model score near the top; see paper
    # Section 5 rewrite).
    weights:
      discrimination: 0.5
      ece: 0.3
      type_accuracy: 0.2

    # Ablation schemes reported in the paper's weight-justification
    # analysis (Reviewer aebp: "rationale behind weights not well
    # justified"). "main" MUST match the `weights` block above exactly —
    # compute_metrics.py asserts this at runtime so the two can never
    # silently drift apart again.
    weight_schemes:
      main:        [0.5,   0.3,   0.2]
      equal:       [0.333, 0.333, 0.334]
      calib_heavy: [0.3,   0.5,   0.2]
      type_heavy:  [0.4,   0.2,   0.4]
      disc_only:   [1.0,   0.0,   0.0]

# ---------- Inference ----------
inference:
  batch_size: 4
  temperature: 0.0            # greedy for reproducibility
  num_workers: 4
  # Which real VLMs the shuffled-image validity baseline runs against by
  # default. Previously hardcoded to qwen25_vl only ("fastest"), which
  # meant the model the paper's headline claims rest on (MedGemma) was
  # never actually tested for whether it uses the image at all. Default
  # is now all three vision-capable models; override with --model on the
  # CLI for a faster single-model run during development.
  shuffled_image_baseline_models: ["qwen25_vl", "medgemma", "llava_med"]