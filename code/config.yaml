# ============================================================
# SAFER Benchmark — Master Config v2 (post-review)
#
# CHANGE LOG vs v1:
#   - dataset.n_samples removed as a hard cap for the DEFAULT pipeline.
#     Multi-source (OpenI + ReXGradient) is now the default benchmark
#     build; n_total is None (use everything loaded) unless overridden.
#     The OLD 500-sample single-source path is kept as `legacy_single_source`
#     below purely for reproducing the original submission's numbers, and
#     is no longer read by run_pipeline.sh by default.
#   - metrics.halluscores_weights renamed metrics.halluscore.weights and is
#     now ACTUALLY READ by 03_metrics/compute_metrics.py (previously this
#     block was dead — the code hardcoded W_DISC/W_ECE/W_TYPE independently
#     of this file, which is exactly the kind of silent config/code drift
#     the reviewers flagged for HalluScore once already). The three weight
#     keys are also renamed faithfulness -> discrimination to reflect the
#     redesigned formula (Discrimination = sqrt(MCC_norm * F1), replacing
#     raw clean-sample accuracy) so the config's own field names don't lie
#     about what they weight.
#   - metrics.ece_bins is now actually read (previously code hardcoded
#     N_BINS=10 while this said 15 — now they must agree, single source).
#   - Added metrics.halluscore.weight_schemes for the ablation study, also
#     now read from config rather than hardcoded in compute_metrics.py.
# ============================================================

version: "v2"

paths:
  data_raw:        "data/v1/raw"
  data_processed:  "data/v1/processed"
  models:          "data/v1/models"
  outputs:         "results/v1/outputs"
  metrics:         "results/v1/metrics"
  figures:         "results/v1/figures"

# ---------- Dataset ----------
dataset:
  # Default / current benchmark: 2 sources, EACH capped at 4500 records
  # independently (per_source_cap), for a combined benchmark of up to
  # 9000 samples (4500 OpenI + 4500 ReXGradient). OpenI's true yield after
  # frontal-view + non-empty-report filtering is ~3,955 — BELOW the 4500
  # cap — so the actual combined total will be slightly under 9000
  # (~8,455), and that shortfall is accepted as-is: it is NOT topped up
  # from ReXGradient, and is reported explicitly in the build script's
  # console output / source_counts so it's never silently hidden.
  #
  # per_source_cap is read by build_multi_source() in
  # build_benchmark_multi.py, which caps each source's contribution
  # BEFORE combining — this is deliberately different from the old
  # n_total behavior (below), which pooled ALL sources together and
  # truncated the COMBINED pool, letting whichever source was naturally
  # larger dominate the final mix. Set per_source_cap: null to fall back
  # to that legacy pool-then-truncate-by-n_total behavior instead.
  sources: ["openi", "mimiccxr"]
  per_source_cap: 4500
  n_total: null            # only used if per_source_cap is null (legacy mode)
  # No reason to select more ReXGradient candidate studies than the cap
  # actually needs — this also avoids scanning further into the ~150GB of
  # compressed archives than necessary. If per_source_cap is set and this
  # is left at its old value, build_benchmark_multi.py overrides it to
  # match per_source_cap automatically; set explicitly here anyway so the
  # config file itself isn't misleading to read.
  rexgradient_target_n: null
  injection_rate: 0.5
  random_seed: 42

  # Kept ONLY so the original 500-sample OpenI-only submission can still be
  # exactly reproduced on request (e.g. for a reviewer asking "show me the
  # original numbers"). NOT used by the default pipeline.
  legacy_single_source:
    name: "openi"
    n_samples: 500
    download_url: "https://openi.nlm.nih.gov/imgs/collections/NLMCXR_png.tgz"
    reports_url:  "https://openi.nlm.nih.gov/imgs/collections/NLMCXR_reports.tgz"

# ---------- Hallucination Injection ----------
hallucination:
  types:
    - object      # wrong anatomy mentioned (e.g., "liver" in chest X-ray report)
    - attribute   # wrong property (e.g., "large" -> "small" opacity)
    - relational  # wrong spatial relation (e.g., "left" -> "right")
  per_type_balance: true  # equal distribution across 3 types

